<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070816" />
  <meta name="description" content="Cosmic Nonsense Generator — random absurd prompts with confetti." />
  <title>Cosmic Nonsense</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <canvas id="confetti"></canvas>
  
  <div class="app">
    <header class="glass">
      <h1>✨ Cosmic Nonsense</h1>
      <button id="themeToggle" aria-label="Toggle theme">🌙</button>
    </header>

    <main>
      <div class="prompt-display glass">
        <div id="promptText" class="prompt">Click generate for cosmic absurdity</div>
      </div>

      <div class="controls">
        <button id="generateBtn" class="big-button">Generate Nonsense</button>
        <div class="sub-controls">
          <button id="copyBtn">Copy</button>
          <button id="shareBtn">Share</button>
        </div>
      </div>

      <div class="stats glass">
        <span id="count">0</span> prompts generated
      </div>
    </main>

    <footer class="glass">
      <p>A random prompt generator that works offline</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
